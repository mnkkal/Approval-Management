services:
  # ----------------------------------------------------------------------------
  # 1. Edge Web Proxy (NGINX)
  # ----------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/ssl/certs:ro
      - storage_data:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    networks:
      - apex_network

  # ----------------------------------------------------------------------------
  # 2. Core Application Engine (PHP 8.3 FPM + Laravel 11)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: .env
    user: "www-data:www-data"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex_network
    healthcheck:
      test: ["CMD", "php", "artisan", "apex:healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. Core Background Queue Worker (Emails, OTPs, Webhooks)
  # ----------------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work redis --queue=high,default,notifications --sleep=2 --tries=3 --timeout=90
    env_file: .env
    user: "www-data:www-data"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    networks:
      - apex_network

  # ----------------------------------------------------------------------------
  # 4. Optional Media Conversion Worker (FFmpeg / ImageMagick)
  # Activated only via: docker compose --profile media-worker up -d
  # ----------------------------------------------------------------------------
  media-worker:
    profiles: ["media-worker"]
    build:
      context: .
      dockerfile: docker/workers/ffmpeg/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work redis --queue=media --sleep=5 --tries=1 --timeout=600
    env_file: .env
    user: "www-data:www-data"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    networks:
      - apex_network

  # ----------------------------------------------------------------------------
  # 5. Database (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-apex_db}
      POSTGRES_USER: ${DB_USERNAME:-apex_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apex_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - apex_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-apex_user} -d ${DB_DATABASE:-apex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 6. Cache, Session & Broker (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-apex_secret}"]
    volumes:
      - redis_data:/data
    networks:
      - apex_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-apex_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  apex_network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  storage_data:
